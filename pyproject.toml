[project]
description     = "Urban Mobility Simulation"
name            = "urban-mobility-simulation"
readme          = "README.md"
requires-python = ">=3.10, <3.13.0"
version         = "0.1.0"

classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]


dependencies = [
  "beartype>=0.21.0",
  "cython>=3.1.0",
  "geojson>=3.2.0",
  "geopandas>=1.0.1",
  "h3>=4.2.2",
  "haversine>=2.9.0",
  "matplotlib>=3.9.4",
  "pandas>=2.2.3",
  "pip>=25.0.1",
  "pqdm>=0.2.0",
  "prettytable>=3.16.0",
  "pyarrow>=19.0.1",
  "pydantic>=2.11.4",
  "pyinstrument>=5.0.2",
  "shapely>=2.0.7",
  "simpy>=4.1.1",
  "statsmodels>=0.14.4",
  "tqdm>=4.67.1",
]
[dependency-groups]
dev = [
  { include-group = "performance" },
  { include-group = "pre-commit" },
  { include-group = "testing" },
  { include-group = "typing" },
]

performance = ["py-spy>=0.3.11", "pyperf>=2.9.0", "scalene>=1.5.51"]

pre-commit = ["pre-commit>=4.2.0", "ruff>=0.11.0"]

testing = ["pytest-coverage>=0.0", "pytest-xdist~=3.6", "pytest>=8.3.5"]

typing = [
  "mypy>=1.15.0",
  "pandas-stubs>=2.2.2.240807",
  "types-shapely>=2.1.0.20250512",
]


[project.optional-dependencies]
notebooks = [
    "contextily>=1.6.2",
    "ipython>=8.18.1",
    "notebook>=7.3.2",
    "seaborn>=0.13.2",
    "sidetable>=0.9.1",
]
ml = [
    "torch>=2.6.0",
    "highspy>=1.10.0",
    "pyomo>=6.9.2",
]

[build-system]
build-backend = "setuptools.build_meta"
requires      = ["cython", "setuptools"]


[tool.setuptools]
packages = [
  "simulation",
  "simulation.environment",
  "simulation.environment.cython_ext",
]

ext-modules = [
  { name = "simulation.environment.cython_ext.cy_geodesic", sources = [
    "simulation/environment/cython_ext/cy_geodesic.pyx",
  ], extra-compile-args = [
    "-O3",
  ] },
]


[tool.ruff]
extend-exclude = ["*.ipynb"]
fix            = true
output-format  = "grouped"
[tool.ruff.format]
skip-magic-trailing-comma = true
[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.uv]
python-preference = "only-managed"

[tool.ruff.lint]
# defaults: ["E4", "E7", "E9", "F"]
select = [
  "ANN",
  "D",
  "E4",
  "E7",
  "E9",
  "F",
  "G",
  "PLC0205",
  "RUF",
  "SLF",
  "T20",
  "UP",
  "TC",
]
# Skip unused variable rules (`F841`).
ignore = ["E721"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# These directories do not follow the same style as the rest of the codebase.
"learning/*"      = ["D"]
"planning/*"      = ["D"]
"resources/*"     = ["D"]
"tests/*"         = ["D", "SLF001"]
"visualization/*" = ["D"]
#TODO: These should be gradually removed once properly annotated.
"public_transport_template.py"      = ["D"]
"ridehailing_template.py"           = ["D"]
"shared_vehicle_fleet_template.py"  = ["D"]
"simulation/__init__.py"            = ["D"]
"simulation/agent/*"                = ["D"]
"simulation/environment/*"          = ["D"]
"simulation/helper/time.py"         = ["D"]
"simulation/infrastructure/*"       = ["D"]
"simulation/operator/*"             = ["D"]
"simulation/tasks/*"                = ["D"]
"simulation/vehicle/*"              = ["D"]
"simulation/vehicle_choice_model/*" = ["D"]
"simulation/world/markets/*"        = ["D"]
"simulation/world/population/*"     = ["D"]
"simulation/world/world.py"         = ["D"]
"tracking/*"                        = ["D"]
"utils.py"                          = ["D"]
"walking_template.py"               = ["D"]

[tool.mypy]
# Enable type checking for all simulation modules
exclude = []
files   = ["simulation/"]

# General type checking options
check_untyped_defs  = true
warn_unreachable    = true
warn_unused_configs = true

# Strictness and error reporting
disallow_any_generics    = true
disallow_incomplete_defs = true
disallow_untyped_defs    = true
no_implicit_optional     = true
warn_redundant_casts     = true
warn_return_any          = true

# Enable specific error codes
enable_error_code = ["redundant-expr", "truthy-bool"]

# Since we are incrementally adding type hints, we want to ignore errors in
# untyped modules. Remove modules from this list as they are typed.
[[tool.mypy.overrides]]
ignore_errors = true
module = [
  "simulation.agent.action_space",
  "simulation.agent.agent",
  "simulation.agent.deep_q_learning",
  "simulation.agent.episodic_semi_gradient_n_step_sarsa",
  "simulation.agent.episodic_semi_gradient_sarsa",
  "simulation.agent.policy",
  "simulation.agent.rl_agent",
  "simulation.agent.user",
  "simulation.environment.environment",
  "simulation.environment.geodesic_environment",
  "simulation.environment.geodesic_position",
  "simulation.helper.configuration.configuration",
  "simulation.helper.logging.extra_default_filter",
  "simulation.helper.logging.simulation_context_filter",
  "simulation.helper.random.random_manager",
  "simulation.helper.singleton",
  "simulation.helper.time",
  "simulation.infrastructure.charging_stations.charging_infastructure",
  "simulation.infrastructure.charging_stations.charging_station",
  "simulation.infrastructure.charging_stations.virtual_charging_infrastructure",
  "simulation.infrastructure.charging_stations.virtual_charging_station",
  "simulation.infrastructure.helper.distance_matrix_importer",
  "simulation.infrastructure.helper.timetable",
  "simulation.infrastructure.route",
  "simulation.infrastructure.transit_network.route_segment",
  "simulation.infrastructure.transit_network.stop",
  "simulation.operator.data_transfer_object.transportation_alternative",
  "simulation.operator.data_transfer_object.transportation_alternative_browser",
  "simulation.operator.data_transfer_object.transportation_alternative_ridehailing",
  "simulation.operator.data_transfer_object.vehicle_allocation",
  "simulation.operator.fleet_factory",
  "simulation.operator.interface.payment_interface",
  "simulation.operator.interface.search_engine_interface",
  "simulation.operator.interface.vehicle_allocation_engine_interface",
  "simulation.operator.mixed_ride_hailing_fleet",
  "simulation.operator.mixed_shared_vehicle_fleet",
  "simulation.operator.operations_management.algorithms.charging_station_allocation",
  "simulation.operator.operations_management.algorithms.distance_based_bidding_strategy",
  "simulation.operator.operations_management.integrated_shared_mobility_operations",
  "simulation.operator.operations_management.operations",
  "simulation.operator.operations_management.operations_public_transport",
  "simulation.operator.operations_management.ridehailing_MP_charging_operations",
  "simulation.operator.operations_management.ridehailing_base_charging_operations",
  "simulation.operator.operations_management.ridehailing_shared_charging_operations",
  "simulation.operator.operations_management.ridehailing_uncoordinated_charging_operations",
  "simulation.operator.operations_management.service_tasks.charging_task",
  "simulation.operator.operations_management.service_tasks.charging_task_ridehailing",
  "simulation.operator.operations_management.service_tasks.multi_service_task",
  "simulation.operator.operations_management.service_tasks.relocation_task",
  "simulation.operator.operations_management.service_tasks.service_task",
  "simulation.operator.operations_management.task_queue",
  "simulation.operator.operator",
  "simulation.operator.public_transit_operator",
  "simulation.operator.public_transport_allocation_engine",
  "simulation.operator.public_transport_search_engine",
  "simulation.operator.public_transport_vehicle_fleet",
  "simulation.operator.ride_hailing_allocation_engine",
  "simulation.operator.ride_hailing_operator",
  "simulation.operator.ride_hailing_search_engine",
  "simulation.operator.service_worker",
  "simulation.operator.service_workforce",
  "simulation.operator.shared_mobility_operator",
  "simulation.operator.shared_vehicle_allocation_engine",
  "simulation.operator.shared_vehicle_search_engine",
  "simulation.operator.walking_search_engine",
  "simulation.tasks.transport_task",
  "simulation.tasks.transportation_search_task",
  "simulation.vehicle.interfaces.driver_interface",
  "simulation.vehicle.interfaces.passenger_interface",
  "simulation.vehicle.public_transit_bus",
  "simulation.vehicle.public_transit_vehicle",
  "simulation.vehicle.ride_hailing_AV",
  "simulation.vehicle.ride_hailing_car",
  "simulation.vehicle.ride_hailing_vehicle",
  "simulation.vehicle.shared_vehicle",
  "simulation.vehicle.walking",
  "simulation.vehicle_choice_model.distance_based_shared_vehicle_choice_behavior",
  "simulation.vehicle_choice_model.only_car_vehicle_choice_behavior",
  "simulation.vehicle_choice_model.only_walking_choice_behavior",
  "simulation.vehicle_choice_model.public_transit_vehicle_choice_behavior",
  "simulation.vehicle_choice_model.trip_characteristics",
  "simulation.world",
  "simulation.world.demand.demand_factory",
  "simulation.world.markets.auction",
  "simulation.world.markets.interfaces.bidder_interface",
  "simulation.world.markets.shared_charging_auction",
  "simulation.world.world",
  "tracking.tracking",
  "tracking.tracking_interface",
]

[tool.pytest.ini_options]
addopts = [
  "--durations=10",
  "--strict-config",
  "--strict-markers",
  "--tb=short",
  "-ra",
]
markers = [
  "integration: Integration tests",
  "slow: Slow running tests (deselect with '-m \"not slow\"')",
  "unit: Unit tests",
]
python_classes = ["Test*"]
python_files = ["*_test.py", "test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
