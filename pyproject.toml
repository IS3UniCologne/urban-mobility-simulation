[project]
name            = "urban-mobility-simulation"
version         = "0.1.0"
description     = "Urban Mobility Simulation"
readme          = "README.md"
requires-python = ">=3.9.2, <3.13.0"
dependencies    = [
    "beartype>=0.20.0",
    "geopandas>=1.0.1",
    "h3>=3.7.1, <4",
    "haversine>=2.9.0",
    "matplotlib>=3.9.4",
    "pip>=25.0.1",
    "pqdm>=0.2.0",
    "pyarrow>=19.0.1",
    "shapely>=2.0.7",
    "simpy>=4.1.1",
    "statsmodels>=0.14.4",
    "tqdm>=4.67.1",
]
[dependency-groups]
dev = [
    "ruff>=0.11.0",
    { include-group = "typing" },
    { include-group = "performance" },
    { include-group = "testing" },
]

performance =[
    "py-spy>=0.3.11",
    "pyperf>=2.9.0",
    "scalene>=1.5.51",
]

testing= [
    "pytest>=8.3.5",
    "pytest-coverage>=0.0",
]

typing = [
    "mypy>=1.15.0",
    "pandas-stubs>=2.2.2.240807",
]

[project.optional-dependencies]
notebooks = [
    "contextily>=1.6.2",
    "ipython>=8.18.1",
    "notebook>=7.3.2",
    "seaborn>=0.13.2",
    "sidetable>=0.9.1",
]
ml = [
    "torch>=2.6.0",
    "docplex>=2.29.241",
    "cplex>=22.1.2.0",
]

[tool.ruff]
fix            = true
output-format  = "grouped"
extend-exclude = ["*.ipynb"]
[tool.ruff.format]
skip-magic-trailing-comma = true
[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.uv]
python-preference = "only-managed"

[tool.ruff.lint]
# defaults: ["E4", "E7", "E9", "F"]
select = ["E4", "E7", "E9", "F", "PLC0205"]
# Skip unused variable rules (`F841`).
ignore = ["E721"]


[tool.mypy]
check_untyped_defs = true
enable_error_code = [ "redundant-expr", "truthy-bool"]
files = [
  "simulation/",
]
exclude = [
]
warn_unreachable = true
warn_unused_configs = true

# Since we are incrementally adding type hints, we want to ignore errors in
# untyped modules. Remove modules from this list as they are typed.
[[tool.mypy.overrides]]
ignore_errors = true
module = [
  "simulation.world",
  "simulation.operator",
  "simulation.agent.action_space",
  "simulation.agent.agent",
