[project]
name            = "urban-mobility-simulation"
version         = "0.1.0"
description     = "Urban Mobility Simulation"
readme          = "README.md"
requires-python = ">=3.9.2, <3.13.0"
dependencies    = [
    "beartype>=0.20.0",
    "geopandas>=1.0.1",
    "h3>=3.7.1, <4",
    "haversine>=2.9.0",
    "matplotlib>=3.9.4",
    "pip>=25.0.1",
    "pqdm>=0.2.0",
    "pyarrow>=19.0.1",
    "shapely>=2.0.7",
    "simpy>=4.1.1",
    "statsmodels>=0.14.4",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
notebooks = [
    "contextily>=1.6.2",
    "ipython>=8.18.1",
    "notebook>=7.3.2",
    "seaborn>=0.13.2",
    "sidetable>=0.9.1",
]
ml = [
    "torch>=2.6.0",
    "docplex>=2.29.241",
    "cplex>=22.1.2.0",
]

[tool.ruff]
fix            = true
output-format  = "grouped"
extend-exclude = ["*.ipynb"]
[tool.ruff.format]
skip-magic-trailing-comma = true
[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pyperf>=2.9.0",
    "pytest>=8.3.5",
    "pytest-coverage>=0.0",
    "ruff>=0.11.0",
    "scalene>=1.5.51",
]
[tool.ruff.lint]
# defaults: ["E4", "E7", "E9", "F"]
select = ["E4", "E7", "E9", "F", "PLC0205", "D"]
# Skip unused variable rules (`F841`).
ignore = ["E721"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# These directories do not follow the same style as the rest of the codebase.
"test/*" = ["D"]
"visualization/*" = ["D"]
"resources/*" = ["D"]
"planning/*" = ["D"]
"learning/*" = ["D"]
#TODO: These should be gradually removed once properly annotated.
"simulation/agent/*" = ["D"]
"simulation/environment/*" = ["D"]
"simulation/helper/*" = ["D"]
"simulation/infrastructure/*" = ["D"]
"simulation/metrics/*" = ["D"]
"simulation/operator/*" = ["D"]
"simulation/tasks/*" = ["D"]
"simulation/vehicle/*" = ["D"]
"simulation/vehicle_choice_model/*" = ["D"]
"simulation/world/*" = ["D"]
"tracking/*" = ["D"]
"simulation/__init__.py" = ["D"]
"walking_template.py" = ["D"]
"shared_vehicle_fleet_template.py" = ["D"]
"ridehailing_template.py" = ["D"]
"public_transport_template.py" = ["D"]
"utils.py" = ["D"]
