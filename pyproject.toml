[project]
description     = "Urban Mobility Simulation"
name            = "urban-mobility-simulation"
readme          = "README.md"
requires-python = ">=3.11, <3.14.0"
version         = "0.1.0"

classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]


dependencies = [
  "beartype>=0.22.9",
  "geojson>=3.3.0",
  "geopandas>=1.1.3",
  "h3>=4.5.0",
  "haversine>=2.9.0",
  "matplotlib>=3.11.0",
  "pandas>=3.0.3",
  "prettytable>=3.17.0",
  "pyarrow>=24.0.0",
  "pydantic>=2.13.4",
  "rtree>=1.4.1",
  "shapely>=2.1.2",
  "simpy>=4.1.2",
  "statsmodels>=0.14.6",
]
[dependency-groups]
dev = [
  { include-group = "benchmarks" },
  { include-group = "pre-commit" },
  { include-group = "testing" },
  { include-group = "typing" },
]

benchmarks = ["pyperf>=2.10.0"]

pre-commit = ["pre-commit>=4.6.0", "ruff>=0.15.17"]

testing = ["pytest-coverage>=0.0", "pytest-xdist~=3.6", "pytest>=9.1.0"]

typing = [
  "pyrefly>=1.0.0",
  "pandas-stubs>=3.0.3.260530",
  "types-shapely>=2.1.0.20260603",
  "types-geopandas>=1.1.3.20260518",
]


[project.optional-dependencies]
ml = [
  "highspy>=1.7.2", #highspy is not explicitly imported anywhere, but used as a solver for pyomo
  "torch>=2.12.0",
  "pyomo>=6.10.1",
]
notebooks = [
  "contextily>=1.7.0",
  "ipython>=9.14.1",
  "notebook>=7.5.7",
  "seaborn>=0.13.2",
]
viz = ["bokeh>=3.9.1"]

[build-system]
build-backend = "setuptools.build_meta"
requires      = ["cython", "setuptools"]


[tool.setuptools]
packages = [
  "simulation",
  "simulation.environment",
  "simulation.environment.cython_ext",
]

ext-modules = [
  { name = "simulation.environment.cython_ext.cy_geodesic", sources = [
    "simulation/environment/cython_ext/cy_geodesic.pyx",
  ], extra-compile-args = [
    "-O3",
  ] },
]


[tool.ruff]
extend-exclude = ["*.ipynb"]
fix            = true
output-format  = "grouped"
[tool.ruff.format]
skip-magic-trailing-comma = true
[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.uv]
python-preference = "only-managed"

[tool.ruff.lint]
# defaults: ["E4", "E7", "E9", "F"]
select = [
  "ANN",
  "D",
  "E4",
  "E7",
  "E9",
  "F",
  "G",
  "PLC0205",
  "RUF",
  "SLF",
  "T20",
  "UP",
  "TC",
]
# Skip unused variable rules (`F841`).
ignore = ["E721"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# These directories do not follow the same style as the rest of the codebase.
"learning/*"      = ["D"]
"planning/*"      = ["D"]
"resources/*"     = ["D"]
"tests/*"         = ["D", "SLF001", "T201"]
"visualization/*" = ["D"]

# Pydantic needs type annotations at runtime, so we ignore TC001 in the configuration
"simulation/helper/configuration/configuration.py" = ["TC001"]


[tool.pyrefly]
min-severity     = "warn"
project-includes = ["simulation/"]
# Exclude untyped modules from error reporting; remove entries as modules are typed
project-excludes = [
  "simulation/agent/action_space.py",
  "simulation/agent/agent.py",
  "simulation/agent/deep_q_learning.py",
  "simulation/agent/episodic_semi_gradient_n_step_sarsa.py",
  "simulation/agent/episodic_semi_gradient_sarsa.py",
  "simulation/agent/policy.py",
  "simulation/agent/rl_agent.py",
  "simulation/helper/configuration/configuration.py",
  "simulation/infrastructure/charging_stations/charging_infastructure.py",
  "simulation/infrastructure/charging_stations/charging_station.py",
  "simulation/infrastructure/charging_stations/virtual_charging_infrastructure.py",
  "simulation/infrastructure/charging_stations/virtual_charging_station.py",
  "simulation/infrastructure/helper/distance_matrix_importer.py",
  "simulation/infrastructure/helper/timetable.py",
  "simulation/infrastructure/route.py",
  "simulation/infrastructure/transit_network/route_segment.py",
  "simulation/infrastructure/transit_network/stop.py",
  "simulation/operator/data_transfer_object/vehicle_allocation.py",
  "simulation/operator/interface/vehicle_allocation_engine_interface.py",
  "simulation/operator/ride_hailing_fleet.py",
  "simulation/operator/mixed_shared_vehicle_fleet.py",
  "simulation/operator/operations_management/algorithms/charging_station_allocation.py",
  "simulation/operator/operations_management/algorithms/distance_based_bidding_strategy.py",
  "simulation/operator/operations_management/integrated_shared_mobility_operations.py",
  "simulation/operator/operations_management/operations.py",
  "simulation/operator/operations_management/operations_public_transport.py",
  "simulation/operator/operations_management/ridehailing_MP_charging_operations.py",
  "simulation/operator/operations_management/ridehailing_base_charging_operations.py",
  "simulation/operator/operations_management/ridehailing_greedy_charging_operations.py",
  "simulation/operator/operations_management/ridehailing_shared_charging_operations.py",
  "simulation/operator/operations_management/ridehailing_uncoordinated_charging_operations.py",
  "simulation/operator/operator.py",
  "simulation/operator/public_transit_operator.py",
  "simulation/operator/public_transport_allocation_engine.py",
  "simulation/operator/public_transport_search_engine.py",
  "simulation/operator/public_transport_vehicle_fleet.py",
  "simulation/operator/ride_hailing_allocation_engine.py",
  "simulation/operator/ride_hailing_operator.py",
  "simulation/operator/ride_hailing_search_engine.py",
  "simulation/operator/service_worker.py",
  "simulation/operator/service_workforce.py",
  "simulation/operator/shared_mobility_operator.py",
  "simulation/operator/shared_vehicle_allocation_engine.py",
  "simulation/operator/shared_vehicle_search_engine.py",
  "simulation/operator/walking_search_engine.py",
  "simulation/vehicle/public_transit_bus.py",
  "simulation/vehicle/public_transit_vehicle.py",
  "simulation/vehicle/ride_hailing_vehicle.py",
  "simulation/vehicle/shared_vehicle.py",
  "simulation/vehicle/walking.py",
  "simulation/world/__init__.py",
  "simulation/world/demand/demand_factory.py",
  "simulation/world/markets/auction.py",
  "simulation/world/markets/interfaces/bidder_interface.py",
  "simulation/world/markets/shared_charging_auction.py",
  "simulation/world/world.py",
]

[tool.pytest.ini_options]
addopts = [
  "--durations=10",
  "--strict-config",
  "--strict-markers",
  "--tb=short",
  "-ra",
]
markers = [
  "end_to_end: marks tests as end-to-end tests",
  "integration: Integration tests",
  "slow: Slow running tests (deselect with '-m \"not slow\"')",
  "unit: Unit tests",
]
python_classes = ["Test*"]
python_files = ["*_test.py", "test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
