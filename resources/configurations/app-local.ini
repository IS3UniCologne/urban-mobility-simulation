[WORLD]
spatial_resolution = 7
temporal_resolution = 4
daily_resolution = 1
city = berlin

[ENVIRONMENT]
# File to Environment Bounding Box
path_env_bounding_box = ./data/environment/geodesic/berlin/env_bounding_box.geojson
path_env_hex_layer_res_7 = ./data/environment/geodesic/berlin/env_hex_7.geojson
path_env_hex_layer_res_8 = ./data/environment/geodesic/berlin/env_hex_8.geojson
path_env_hex_layer_res_9 = ./data/environment/geodesic/berlin/env_hex_9.geojson

[INFRASTRUCTURE]
path_transit_timetable = ./data/infrastructure/transit_timetable.csv
path_transit_shapes = ./data/infrastructure/transit_shapes.csv

[DEMAND]
path_trip_demand = ./data/demand/shared_vehicle_trips_berlin.csv
path_demand_modifiers = ./data/demand/berlin_zero_demand.geojson,./data/demand/line200bufferROUTE.geojson

[SUPPLY]
path_vehicle_supply = ./data/supply/vehicle_supply_distribution_hex_7.csv

[MODE_CHOICE_MODEL]
path_to_mode_choice_model = ./data/choice_model/mode_choice_model.pickle
# random (Random Vehicle Selection), substitution (Substitution Aware), no_sub (No Substitution Effect)
mode_choice_strategy      = substitution
available_modes           = SharedCar,SharedKickScooter,SharedScooter
# Only Relevant for substitution strategy (default)
substitution_boundary     = 0.1

[SETTINGS]
log_level = INFO

[OUTPUT]
persist_results   = True
output_folder      = ./data/output
transaction_file   = transactions.csv
fleet_state_file = fleet_state.csv
TRACK_AGENT = True

# Operator Configurations
[SHARED_VEHICLE_OPERATOR]
# When vehicles drop below RECHARGE_THRESHOLD => cannot be rented and needs to be recharged
RECHARGE_THRESHOLD = 0.1
# Installed Charging Station Power
# kW (slow charger), or 7 kW or 22 kW (fast charger)
CHARGING_STATION_POWER = 3.7
# Number of Service Worker
NUMBER_OF_SERVICE_WORKER = 50
# Base vehicle capacity (i.e.g, how many vehicle can we provide services)
BASE_CAPACITY = 10000
# Base Locations
BASE_REGIONS = 871f1d488ffffff
# Operations Start Time (e.g., 1440 => 00:00am)
OPERATIONS_START = 1440
# Operations Duration (e.g., 8 working hours => 8*60 => 480)
OPERATIONS_DURATION = 480
# Velocity of Relocation Vehicle (i.e., car/van velocity) in meter/min
VEHICLE_RELOCATION_VELOCITY = 400

[TRANSIT_OPERATOR]
# how many minutes the PublicTransitOperator plans ahead ==
TRANSIT_LOOKAHEAD = 10
# how many busses the transit operator is allowed to spawn
MAX_BUSSES = 1

# User Configurations
[USER]
# how many minutes is the TransitUser willing to wait (incl. time to get there) before boarding a transit alternative
# this also includes the required time of getting from drop-off to real destination
TRANSIT_MAX_WAIT = 10
# how are vehicles / transit stops considered in vicinity / reachable? valid: 'hexagon', 'euclidean', 'walk'
SPATIAL_STRATEGY = hexagon

[BUS]
SEATS = 100
# average velocity in european cities is no more than 30 km/h, in meters per minute
VELOCITY = 500

# Problem Abstraction Configurations
[DYNAMIC_ROUTING]
# what actions the bus agent can take
ACTION_SPACE = UP,DOWN,UP_LEFT,UP_RIGHT,DOWN_LEFT,DOWN_RIGHT
# in what resolution the bus agent takes the above actions
ACTION_SPACE_RESOLUTION = 8
# if given, don't construct action corridor from line of sight, but use this, must be ast-parseable set of hex ids
CORRIDOR_PATH = ./data/environment/line200_action_corridor.txt
# negative reward for not reaching the terminal destination
PENALTY = 20
# positive reward for successfully serving a passenger
REWARD = 2
# additional time a dynamic bus is granted, multiplier of the planned route's time
TIMELIMIT = 1.5

[DYNAMIC_CHECKPOINT_ROUTING]
# what actions the bus agent can take
ACTION_SPACE = UP,DOWN,UP_LEFT,UP_RIGHT,DOWN_LEFT,DOWN_RIGHT
# in what resolution the bus agent takes the above actions
ACTION_SPACE_RESOLUTION = 8
# checkpoints as list of ints, references stop_sequence number of timetable
# starts at possible checkpoint 1, origin = 0, destination = -1, will be added automatically
# CHECKPOINTS = 5,10,17,22
CHECKPOINTS = 16
# if given, don't construct action corridor from line of sight, but use this, must be ast-parseable set of hex ids
CORRIDOR_PATH = ./data/environment/line200_action_corridor_8_single.txt
# negative reward for not reaching a checkpoint in time, multiplier of exceded time
PENALTY_CHECKPOINTS = 1
# negative reward for not reaching the terminal destination
PENALTY_UNREACHABLE = 50
# negative reward for taking bad actions (going back)
PENALTY_GOINGBACK = 2
# positive reward for successfully serving a passenger
REWARD = 5
# additional time a dynamic bus is granted, multiplier of the planned route's time
# this is granted uniformly to all checkpoints as well, based on the planned travel time to them
TIMELIMIT = 1.2
# if given, check at each x-th episode the current policy (Q network) for one episode without exploration
PERIODIC_TESTING = 50

# Learning Agent Configurations
[DQN]
# learning rate decay, possible values True or False
# TODO: not implemented in torch version
LR_DECAY = False
# learning rate decay steps, if LR_DECAY is True, then over how many steps should it decay
LR_DECAY_STEPS = 100000
# if given, where to load DQN weights from,fully qualified path from project root
# WEIGHTS_PATH = ./data/output/1000_episodes_weights_20211101-185128.keras
# layer configuration for DQN, tuple of dim (1, n hidden layers+1 for input layer, output layer is fixed)
# DQN_LAYERS = (340,335) # action resolution 9
DQN_LAYERS = (114,109)
# how many episodes to run
EPISODES = 130
# alpha for gradient descent step-size
ALPHA = 0.05
# epsilon for epsilon-greedy action selection
EPS = 0.2
# epsilon decay strategy, one of "none", "linear", "exp"
EPS_DECAY_STRATEGY = none
# epsilon decay speed for exponential decay
EPS_DECAY = 0.9997
# upper boundary for epsilon decay
EPS_MAX = 0.8
# lower boundary for epsilon decay
EPS_MIN = 0.05
# experience replay buffer size in episodes
BUFFERSIZE = 2000
# warm start replaybuffer, given pkl path
# REPLAYBUFFER = ./data/learning/replaybuffer_torch_500.pkl
# minimum experience in episodes before q network training starts,
# is ignored when replay buffer is warm-started
MIN_EXPERIENCE = 1000
# only train at n-th step of running the agent
# TODO: not recognized by torch version of DQN
TRAIN_FREQUENCY = 1
# usage of double Q learning (if False, vanilla DQN is used with target network)
USE_DOUBLE_Q = False
# how many training steps (torch: episodes) before target q network is updated from q network
TARGET_UPDATE_THRESHOLD = 30
# tau, if given, is the parameters for soft-updating the target network only slightly in the direction of the q net
# 0.01 equals a "full" update after 100 episodes (with changing targets, therefore never full!)
TAU = 0.01
# minibatch size for training of the q network
BATCHSIZE = 256
# gamma for discounting rate
GAMMA = 0.99

