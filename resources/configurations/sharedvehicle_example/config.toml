[SETTINGS]
# Logging
LOG_LEVEL      = "DEBUG"
FILE_LOG_LEVEL = "DEBUG"
LOG_TIMESTAMPS = false

# Output
PERSIST_RESULTS = true

[EXPERIMENT_MANAGEMENT]
END_TIME   = 1440
START_TIME = 0


[RANDOM_MANAGER]
# Main seed, set to 0 to generate a new seed on every run
SEED = 42
# Component seeds. If commented out, they will be generated from the main seed. (default for reproducibility)
# Set to 0 to generate a new seed for the component on every run, independent of the main seed.
# Set to any other value to use that value as the seed for the component.
[RANDOM_MANAGER.COMPONENT_SEEDS]
# POPULATIONFACTORY = 0
# FLEETFACTORY =0
# DEMANDFACTORY     = 0
# INITIALSOC        = 0
# GEOENV            = 0


[WORLD]
CITY                = "berlin"
DAILY_RESOLUTION    = "weekday_weekend"
SPATIAL_RESOLUTION  = 7
TEMPORAL_RESOLUTION = 4


[PATH]
# Environment paths
PATH_ENV_BOUNDING_BOX    = "./data/environment/geodesic/{city}/env_bounding_box.geojson"
PATH_ENV_HEX_LAYER_RES_7 = "./data/environment/geodesic/{city}/env_hex_7.geojson"
PATH_ENV_HEX_LAYER_RES_8 = "./data/environment/geodesic/{city}/env_hex_8.geojson"
PATH_ENV_HEX_LAYER_RES_9 = "./data/environment/geodesic/{city}/env_hex_9.geojson"

# Public transit paths
PATH_TRANSIT_SHAPES    = "./data/infrastructure/transit_shapes.csv"
PATH_TRANSIT_TIMETABLE = "./data/infrastructure/transit_timetable.csv"

# Supply paths
PATH_VEHICLE_SUPPLY = "./data/supply/{city}_vehicle_supply_distribution_hex_7.csv"

# Mode Choice Model paths
PATH_TO_MODE_CHOICE_MODEL = "./data/choice_model/distance_based_shared_vehicles.pickle"

# Output paths
FLEET_STATE_FILE = "fleet_state.csv"
OUTPUT_FOLDER    = "./data/output"
TRANSACTION_FILE = "transactions.csv"

# Demand Paths
PATH_DEMAND_MODIFIERS = ["./data/demand/{city}__zero_demand.geojson", "./data/demand/{city}_line200bufferROUTE.geojson"]
PATH_TRIP_DEMAND      = "./data/demand/{city}_shared_vehicle_trips.csv"


[POPULATION]
POPULATION_PROBABILITIES = [0.2, 0.3, 0.5]

