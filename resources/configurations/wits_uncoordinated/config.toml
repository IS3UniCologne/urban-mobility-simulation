[SETTINGS]
# Logging
LOG_LEVEL      = "DEBUG"
FILE_LOG_LEVEL = "DEBUG"
LOG_TIMESTAMPS = true

# Output
PERSIST_RESULTS = true
# TRACK_AGENT     = true


[EXPERIMENT_MANAGEMENT]
START_TIME = 0
END_TIME   = 500


[RANDOM_MANAGER]
# Main seed, set to 0 to generate a new seed on every run
SEED = 0
# Component seeds. If commented out, they will be generated from the main seed. (default for reproducibility)
# Set to 0 to generate a new seed for the component on every run, independent of the main seed.
# Set to any other value to use that value as the seed for the component.
[RANDOM_MANAGER.COMPONENT_SEEDS]
