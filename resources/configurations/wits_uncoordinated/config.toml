# FLEETFACTORY      = 0
# DEMANDFACTORY     = 0
# INITIALSOC        = 0
# GEOENV            = 0


[WORLD]
SPATIAL_RESOLUTION  = 7
TEMPORAL_RESOLUTION = 4
DAILY_RESOLUTION    = "weekday_weekend"
CITY                = "chicago"


[PATH]
# Environment paths
PATH_ENV_BOUNDING_BOX    = "./data/environment/geodesic/{city}/env_bounding_box.geojson"
PATH_ENV_HEX_LAYER_RES_7 = "./data/environment/geodesic/{city}/env_hex_7.geojson"
