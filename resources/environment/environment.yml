name: urban-mobility-simulation
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9.2,<3.10
  - cudatoolkit=11.2
  - cudnn=8.1.0
  - ipython
  - geopandas
  - h3-py>=3.7.1,<4
  - haversine
  - matplotlib
  - notebook
  - seaborn
  - contextily
  - shapely
  - simpy>=4.0.1
  - statsmodels
  - tqdm
  - pip
  - pip:
      - partridge[full]
      - gtfs_kit
      - git+https://github.com/gkhayes/mlrose.git
      - line-profiler-pycharm
      - pqdm
      - psutil
      - tensorflow
