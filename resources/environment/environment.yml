  - defaults
dependencies:
  - python>=3.9.2,<3.10
  - austin
  - ipython
  - geopandas
  - haversine
  - matplotlib
  - notebook
  - seaborn
  - contextily
  - shapely
  - simpy>=4.0.1
  - statsmodels
