name: urban-mobility-simulation
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.7.10
  - ipython
  - geopandas
  - h3-py>=3.7.1
  - haversine
  - matplotlib
  - notebook
  - seaborn
  - shapely
  - simpy>=4.0.1
  - statsmodels
  - tqdm
  - pip
  - pip:
      - partridge[full]
      - peartree
      - gtfs_kit
      - mlrose
      - line-profiler-pycharm
      - pqdm
      - psutil
      - tensorflow