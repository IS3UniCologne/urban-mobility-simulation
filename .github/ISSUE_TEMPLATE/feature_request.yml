name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the problem or limitation you are experiencing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have thought about or tried.
    validations:
      required: false
  - type: dropdown
    id: implementation
    attributes:
      label: Are you willing to implement this yourself?
      description: >
        See [CONTRIBUTING.md](https://github.com/IS3UniCologne/urban-mobility-simulation/blob/develop/CONTRIBUTING.md)
        for how we work.
      options:
        - "Yes, with some guidance"
        - "Yes, on my own"
        - "No"
    validations:
      required: true
