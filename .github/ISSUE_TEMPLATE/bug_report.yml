name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Paste relevant log output here.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. umosim demo ...
        2. Run the simulation with ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version or git commit hash you are running.
      placeholder: v0.x.y or 82d6a474
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12 (check with uv run python --version inside the virtual environment)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 15, Windows 11, ...
    validations:
      required: true
