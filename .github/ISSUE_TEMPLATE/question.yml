name: Question
description: Ask a question about using or understanding the simulation
labels: ["question"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The more context you give, the better the answer.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
      description: Docs you read, commands you ran, things that almost worked.
    validations:
      required: false
