name: CI Pipeline
on:
  # run when pushing to develop
  push:
    branches: [develop]
  # run when opening, synchronizing, or reopening a pull request
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # added using https://github.com/step-security/secure-workflows
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same PR. Every push to develop
# keeps its own run, so each merge shows its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pyrefly:
    runs-on: ubuntu-latest
    name: Pyrefly static type checking

    steps:
    - name: Check out the repository
      uses: actions/checkout@v7

    - name: Install the latest version of uv
      uses:  astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Install Nox
      run: |
        uv tool install nox

    - name: Run pyrefly
      run: |
        nox -rs pyrefly

  docs:
    runs-on: ubuntu-latest
    name: Sphinx documentation
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nox
        run: |
          uv tool install nox

      - name: Build documentation
        run: |
          nox -rs docs

  interrogate:
    runs-on: ubuntu-latest
    name: Docstring coverage
    permissions:
      contents: read
      # PRs get a comment with the coverage change
      pull-requests: write
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # On push to develop the badge is committed as the bot GitHub App, since the develop
      # ruleset rejects a GITHUB_TOKEN push. The App is on the ruleset's bypass list.
      - name: Create GitHub App token
        id: app-token
        if: ${{ github.event_name == 'push' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RUFF_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RUFF_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Install Nox
        run: |
          uv tool install nox

      # The committed badge is the coverage of the target branch, since develop regenerates it on every push
      - name: Read committed coverage
        id: before
        run: |
          echo "coverage=$(sed -n 's/.*<title>interrogate: \([0-9.]*\)%.*/\1/p' docs/interrogate_badge.svg | head -n 1)" >> "$GITHUB_OUTPUT"

      # Fails below `fail-under` in pyproject.toml, and rewrites docs/interrogate_badge.svg
      - name: Check docstring coverage
        run: |
          nox -rs interrogate

      - name: Read new coverage
        id: after
        if: ${{ !cancelled() }}
        run: |
          echo "coverage=$(sed -n 's/.*<title>interrogate: \([0-9.]*\)%.*/\1/p' docs/interrogate_badge.svg | head -n 1)" >> "$GITHUB_OUTPUT"

      # On merge into develop, the badge is committed, and only when the rounded coverage changed.
      # The App's commit starts a new run, which finds the badge current and commits nothing.
      - name: Commit updated badge
        if: ${{ !cancelled() && github.event_name == 'push' }}
        # Pinned to v7.2.1, since this action holds a token that may push to develop
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c
        with:
          commit_message: "chore: update interrogate badge"
          file_pattern: docs/interrogate_badge.svg

      - name: Comment coverage change on pull request
        # PRs from forks get a read-only token, their report stays in the job summary only
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        env:
          COVERAGE_BEFORE: ${{ steps.before.outputs.coverage }}
          COVERAGE_AFTER: ${{ steps.after.outputs.coverage }}
        with:
          script: |
            const marker = "<!-- interrogate-report -->";
            const before = process.env.COVERAGE_BEFORE;
            const after = process.env.COVERAGE_AFTER;
            const note = "The README badge is regenerated when this PR is merged into `develop`.";
            const body = `${marker}\n**Docstring coverage:** ${before}% → ${after}%\n\n${note}\n`;
            await core.summary.addRaw(body, true).write();
            if (context.payload.pull_request.head.repo?.full_name !== context.repo.owner + "/" + context.repo.repo) {
              return;
            }
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.startsWith(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }

  fast-test:
    runs-on: ubuntu-latest
    name: Fast Tests (unit + integration)
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nox
        run: |
          uv tool install nox

      - name: Run Fast Tests
        id: fast_test
        run: |
          nox -rs pytest_fast

  end-to-end-test:
    runs-on: ubuntu-latest
    name: End-to-End Test
    needs: fast-test # Ensure fast tests pass before running end-to-end tests
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nox
        run: |
          uv tool install nox

      - name: Run End-to-End Tests
        id: end_to_end_test
        run: |
          nox -rs pytest_e2e

      # Attempt number keeps the artifact name unique (a re-run uploads into the same run)
      - name: Upload simulation logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-logs-attempt-${{ github.run_attempt }}
          path: data/test_output/logs/

      - name: Show the end of each simulation log on failure
        if: failure()
        run: |
          echo "=== Log file content samples ==="
          for logfile in data/test_output/logs/*; do
            echo "=== $logfile ==="
            tail -n 20 "$logfile"
            echo ""
          done

  benchmark:
    runs-on: ubuntu-latest
    name: Benchmark
    # Reports CPU time and peak memory against the target branch in the job summary and a PR comment (no comment on fork PRs)
    # A regression never fails this job, only a benchmark that cannot run does.
    needs: end-to-end-test
    # Also runs when the tests failed, so the comment does not keep the numbers of an
    # earlier push. Release PRs only bump the version, so both sides run the same code.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # the first parent of the PR merge commit is the tip of the target branch
          fetch-depth: 2

      - name: Install Nox
        run: |
          uv tool install nox

      - name: Run benchmark
        if: needs.end-to-end-test.result == 'success'
        run: |
          nox -rs benchmark -- --base HEAD^1 --report benchmark-report.md

      - name: Add report to job summary
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f benchmark-report.md ]; then
            printf '## Benchmark\n\nNo comparison for this push, since the tests or the benchmark failed.\n' > benchmark-report.md
          fi
          cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        # PRs from forks get a read-only token, their report stays in the job summary only
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- benchmark-report -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.readFileSync("benchmark-report.md", "utf8");
            const body = `${marker}\n${report}\n[Run log](${runUrl})\n`;
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.startsWith(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
