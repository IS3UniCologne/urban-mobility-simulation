### This workflow is used to test the templates as an integration test
### The results are stored in a JSON file on the self-hosted runner and can be accessed via SSH

name: CI Pipeline
on:
  # run when pushing to main or develop
  push:
    branches: [main, develop]
  # run when opening, synchronizing, or reopening a pull request
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  mypy:
    runs-on: self-hosted
    name: Mypy static type checking

    steps:
    - name: Check out the repository
      uses: actions/checkout@v5

    - name: Install the latest version of uv
      uses:  astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Install Nox
      run: |
        uv tool install nox

    - name: Run mypy
      run: |
        nox -rs mypy

  unit-test:
    runs-on: self-hosted
    name: Unit Test
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nox
        run: |
          uv tool install nox

      - name: Run Unit Tests
        id: unit_test
        run: |
          nox -rs pytest -- --durations=10 -m unit

  end-to-end-test:
    runs-on: self-hosted
    name: End-to-End Test
    needs: unit-test # Ensure unit tests pass before running end-to-end tests
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Copy local files to workspace
        run: cp -r /home/ci/data/* $GITHUB_WORKSPACE/data

      - name: Install Nox
        run: |
          uv tool install nox

      - name: Run End-to-End Tests
        id: end_to_end_test
        run: |
          nox -rs pytest -- --durations=10 -m end_to_end

      - name: Copy simulation logs on failure
        if: failure()
        run: |
          # Get short commit SHA (first 7 characters)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "End-to-End test failed. Copying simulation logs for debugging..."
          mkdir -p /home/ci/test_runner_data/failed_logs_${{github.run_number}}_${SHORT_SHA}
          cp -r data/test_output/logs/* /home/ci/test_runner_data/failed_logs_${{github.run_number}}_${SHORT_SHA}/
          echo "Logs copied to /home/ci/test_runner_data/failed_logs_${{github.run_number}}_${SHORT_SHA}/"

          # Output last few lines of each log file for quick inspection
          echo "=== Log file content samples ==="
          for logfile in data/test_output/logs/*; do
            echo "=== $logfile ==="
            tail -n 20 "$logfile"
            echo ""
          done
