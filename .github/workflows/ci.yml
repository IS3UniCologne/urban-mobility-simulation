### This workflow is used to test the templates as an integration test
### The results are stored in a JSON file on the self-hosted runner and can be accessed via SSH

name: CI Pipeline
on:
  # run when pushing to develop
  push:
    branches: [develop]
  # run when opening, synchronizing, or reopening a pull request
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # added using https://github.com/step-security/secure-workflows
  contents: read

# Cancel a in-progress run when a newer commit is pushed to the same PR or branch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job runs on the self-hosted runner and skips PRs from forks.
# A fork PR runs its own copy of this file and can drop the guard, so it only holds
# while no maintainer approves a fork run whose diff touches .github/ (see CONTRIBUTING.md).
jobs:
  pyrefly:
    runs-on: self-hosted
    name: Pyrefly static type checking
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
    - name: Check out the repository
      uses: actions/checkout@v7

    - name: Install the latest version of uv
      uses:  astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Install Nox
      run: |
        uv tool install nox

    - name: Run pyrefly
      run: |
        nox -rs pyrefly

  docs:
    runs-on: self-hosted
    name: Sphinx documentation
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nox
        run: |
          uv tool install nox

      - name: Build documentation
        run: |
          nox -rs docs

  interrogate:
    runs-on: self-hosted
    name: Docstring coverage
    permissions:
      # push to develop commits the regenerated badge back
      contents: write
      # PRs get a comment with the coverage change
      pull-requests: write
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nox
        run: |
          uv tool install nox

      # The committed badge is the coverage of the target branch, since develop regenerates it on every push
      - name: Read committed coverage
        id: before
        run: |
          echo "coverage=$(sed -n 's/.*<title>interrogate: \([0-9.]*\)%.*/\1/p' docs/interrogate_badge.svg | head -n 1)" >> "$GITHUB_OUTPUT"

      # Fails below `fail-under` in pyproject.toml, and rewrites docs/interrogate_badge.svg
      - name: Check docstring coverage
        run: |
          nox -rs interrogate

      - name: Read new coverage
        id: after
        if: ${{ !cancelled() }}
        run: |
          echo "coverage=$(sed -n 's/.*<title>interrogate: \([0-9.]*\)%.*/\1/p' docs/interrogate_badge.svg | head -n 1)" >> "$GITHUB_OUTPUT"

      # On merge into develop, the badge is committed, and only when the rounded coverage changed
      # Commits by GITHUB_TOKEN do not trigger new workflow runs, so this shouldn't loop.
      - name: Commit updated badge
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update interrogate badge"
          file_pattern: docs/interrogate_badge.svg

      - name: Comment coverage change on pull request
        # PRs from forks get a read-only token, their report stays in the job summary only
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        env:
          COVERAGE_BEFORE: ${{ steps.before.outputs.coverage }}
          COVERAGE_AFTER: ${{ steps.after.outputs.coverage }}
        with:
          script: |
            const marker = "<!-- interrogate-report -->";
            const before = process.env.COVERAGE_BEFORE;
            const after = process.env.COVERAGE_AFTER;
            const note = "The README badge is regenerated when this PR is merged into `develop`.";
            const body = `${marker}\n**Docstring coverage:** ${before}% → ${after}%\n\n${note}\n`;
            await core.summary.addRaw(body, true).write();
            if (context.payload.pull_request.head.repo.full_name !== context.repo.owner + "/" + context.repo.repo) {
              return;
            }
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.startsWith(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }

  fast-test:
    runs-on: self-hosted
    name: Fast Tests (unit + integration)
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nox
        run: |
          uv tool install nox

      - name: Run Fast Tests
        id: fast_test
        run: |
          nox -rs pytest_fast

  end-to-end-test:
    runs-on: self-hosted
    name: End-to-End Test
    needs: fast-test # Ensure fast tests pass before running end-to-end tests
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy local files to workspace
        run: cp -r /home/ci/data/* $GITHUB_WORKSPACE/data

      - name: Install Nox
        run: |
          uv tool install nox

      - name: Run End-to-End Tests
        id: end_to_end_test
        run: |
          nox -rs pytest_e2e

      - name: Copy simulation logs on failure
        if: failure()
        run: |
          # Get short commit SHA (first 7 characters)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "End-to-End test failed. Copying simulation logs for debugging..."
          mkdir -p /home/ci/test_runner_data/failed_logs_${{github.run_number}}_${SHORT_SHA}
          cp -r data/test_output/logs/* /home/ci/test_runner_data/failed_logs_${{github.run_number}}_${SHORT_SHA}/
          echo "Logs copied to /home/ci/test_runner_data/failed_logs_${{github.run_number}}_${SHORT_SHA}/"

          # Output last few lines of each log file for quick inspection
          echo "=== Log file content samples ==="
          for logfile in data/test_output/logs/*; do
            echo "=== $logfile ==="
            tail -n 20 "$logfile"
            echo ""
          done

  benchmark:
    runs-on: self-hosted
    name: Benchmark
    # Reports CPU time and peak memory against the target branch in a PR comment.
    # A regression never fails this job, only a benchmark that cannot run does.
    needs: end-to-end-test
    # Also runs when the tests failed, so the comment does not keep the numbers of an
    # earlier push. Release PRs only bump the version, so both sides run the same code.
    # We repeat the fork guard here because !cancelled() also drops the implicit success check on needs.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'release-please--') }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # the first parent of the PR merge commit is the tip of the target branch
          fetch-depth: 2

      - name: Install Nox
        run: |
          uv tool install nox

      - name: Run benchmark
        if: needs.end-to-end-test.result == 'success'
        run: |
          nox -rs benchmark -- --base HEAD^1 --report benchmark-report.md

      - name: Add report to job summary
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f benchmark-report.md ]; then
            printf '## Benchmark\n\nNo comparison for this push, since the tests or the benchmark failed.\n' > benchmark-report.md
          fi
          cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- benchmark-report -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.readFileSync("benchmark-report.md", "utf8");
            const body = `${marker}\n${report}\n[Run log](${runUrl})\n`;
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.startsWith(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
