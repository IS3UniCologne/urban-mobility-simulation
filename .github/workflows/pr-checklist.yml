name: pr-checklist

on:
  pull_request_target:
    types: [opened]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: ${{ !startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Post the checklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr comment "$PR" --body-file .github/pr-checklist.md
