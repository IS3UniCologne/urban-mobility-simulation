name: Template Test
on:
  push:
  pull_request:

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  test-templates:
    runs-on: self-hosted
    name: Test Templates
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Copy local files to workspace
        run: cp -r /home/ci/data/* $GITHUB_WORKSPACE/data
      - name: Set up Environment
        run: uv sync
      - name: Install and run test
        run: uv run ridehailing_template.py resources/configurations/config_template.toml
