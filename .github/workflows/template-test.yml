### This workflow is used to test the templates as an integration test
### The results are stored in a JSON file on the self-hosted runner and can be accessed via SSH

name: Template Test
on:
  # run when pushing to main or develop
  push:
    branches: [main, develop]
  # run when opening, synchronizing, or reopening a pull request
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  test-templates:
    runs-on: self-hosted
    name: Test Templates
    steps:
      - name: Set dynamic filename
        run: |
          export OUTPUT_FILE="step_durations_$(date +'%Y-%m-%d_%H-%M-%S').json"
          echo "OUTPUT_FILE=$OUTPUT_FILE" >> $GITHUB_ENV

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy local files to workspace
        run: cp -r /home/ci/data/* $GITHUB_WORKSPACE/data

      - name: Set up Environment
        run: uv sync

      - name: Initialize JSON object
        run: |
          # Initialize the JSON structure and write it to a temporary file
          echo "{\"workflow_run\": {" > $GITHUB_WORKSPACE/$OUTPUT_FILE
          echo "  \"commit_id\": \"$(git rev-parse HEAD)\"," >> $GITHUB_WORKSPACE/$OUTPUT_FILE
          echo "  \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\"," >> $GITHUB_WORKSPACE/$OUTPUT_FILE
          echo "  \"timestamp\": \"$(date +'%Y-%m-%dT%H:%M:%S')\"," >> $GITHUB_WORKSPACE/$OUTPUT_FILE
          echo "  \"steps\": [" >> $GITHUB_WORKSPACE/$OUTPUT_FILE

      - name: Run ridehailing_template.py
        run: |
          start_time=$(date +%s)
          uv run ridehailing_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          step="{\"name\": \"Run ridehailing_template.py\", \"duration_seconds\": $duration}"
          echo "    $step," >> $GITHUB_WORKSPACE/$OUTPUT_FILE

      - name: Run shared_vehicle_fleet_template.py
        run: |
          start_time=$(date +%s)
          uv run shared_vehicle_fleet_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          step="{\"name\": \"Run shared_vehicle_fleet_template.py\", \"duration_seconds\": $duration}"
          echo "    $step," >> $GITHUB_WORKSPACE/$OUTPUT_FILE

      - name: Run public_transport_template.py
        run: |
          start_time=$(date +%s)
          uv run public_transport_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          step="{\"name\": \"Run public_transport_template.py\", \"duration_seconds\": $duration}"
          echo "    $step" >> $GITHUB_WORKSPACE/$OUTPUT_FILE

      - name: Complete and write JSON
        run: |
          # Complete the JSON structure and write it to the output file
          echo "  ]" >> $GITHUB_WORKSPACE/$OUTPUT_FILE
          echo "} }" >> $GITHUB_WORKSPACE/$OUTPUT_FILE
          # Move the final output file to the correct location
          mv $GITHUB_WORKSPACE/$OUTPUT_FILE /home/ci/test_runner_data/$OUTPUT_FILE
