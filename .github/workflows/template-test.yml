name: Template Test
on:
  push:
  pull_request:

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  test-templates:
    runs-on: self-hosted
    name: Test Templates
    steps:
      - name: Set dynamic filename
        run: |
          export OUTPUT_FILE="step_durations_$(date +'%Y-%m-%d_%H-%M-%S').json"
          echo "OUTPUT_FILE=$OUTPUT_FILE" >> $GITHUB_ENV

      - name: Initialize JSON object
        run: |
          # Initialize an empty JSON structure in a variable
          JSON_OUTPUT="{\"workflow_run\": {"
          JSON_OUTPUT+="\"commit_id\": \"$(git rev-parse HEAD)\","
          JSON_OUTPUT+="\"branch\": \"$(git rev-parse --abbrev-ref HEAD)\","
          JSON_OUTPUT+="\"timestamp\": \"$(date +'%Y-%m-%dT%H:%M:%S')\","
          JSON_OUTPUT+="\"steps\": ["
          echo "JSON_OUTPUT=$JSON_OUTPUT" >> $GITHUB_ENV

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy local files to workspace
        run: cp -r /home/ci/data/* $GITHUB_WORKSPACE/data

      - name: Set up Environment
        run: uv sync

      - name: Run ridehailing_template.py
        run: |
          start_time=$(date +%s)
          uv run ridehailing_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          step="{\"name\": \"Run ridehailing_template.py\", \"duration_seconds\": $duration}"
          # Append the step data to the JSON_OUTPUT variable
          echo "JSON_OUTPUT+=\"$step,\n\"" >> $GITHUB_ENV

      - name: Run shared_vehicle_fleet_template.py
        run: |
          start_time=$(date +%s)
          uv run shared_vehicle_fleet_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          step="{\"name\": \"Run shared_vehicle_fleet_template.py\", \"duration_seconds\": $duration}"
          echo "JSON_OUTPUT+=\"$step,\n\"" >> $GITHUB_ENV

      - name: Run public_transport_template.py
        run: |
          start_time=$(date +%s)
          uv run public_transport_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          step="{\"name\": \"Run public_transport_template.py\", \"duration_seconds\": $duration}"
          echo "JSON_OUTPUT+=\"$step\"" >> $GITHUB_ENV

      - name: Complete and write JSON
        run: |
          # Complete the JSON structure and write it to the output file
          echo "${JSON_OUTPUT}\"steps\": []}" >> /home/ci/test_runner_data/$OUTPUT_FILE
