name: Template Test
on:
  push:
  pull_request:

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  test-templates:
    runs-on: self-hosted
    name: Test Templates
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Copy local files to workspace
        run: cp -r /home/ci/data/* $GITHUB_WORKSPACE/data
      - name: Set up Environment
        run: uv sync
      - name: Run ridehailing template
        run: |
          start_time=$(date +%s)
          uv run ridehailing_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Run ridehailing template took $duration seconds"
          echo "Run ridehailing template: $duration" >> /home/ci/test_runner_data/step_durations.txt
          echo "current_duration_ridehailing_template=$duration" >> $GITHUB_ENV

      - name: Run shared vehicle template
        run: |
          start_time=$(date +%s)
          uv run shared_vehicle_fleet_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Run shared vehicle template took $duration seconds"
          echo "Run shared vehicle template: $duration" >> /home/ci/test_runner_data/step_durations.txt
          echo "current_duration_shared_vehicle_template=$duration" >> $GITHUB_ENV

      - name: Run public transit template
        run: |
          start_time=$(date +%s)
          uv run public_transport_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Run public transit template took $duration seconds"
          echo "Run public transit template: $duration" >> /home/ci/test_runner_data/step_durations.txt
          echo "current_duration_public_transit_template=$duration" >> $GITHUB_ENV
