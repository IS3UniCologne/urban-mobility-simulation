name: Template Test
on:
  push:
  pull_request:

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  test-templates:
    runs-on: self-hosted
    name: Test Templates
    env:
      OUTPUT_FILE: test_results_$(date +'%Y-%m-%d_%H-%M-%S').txt
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Copy local files to workspace
        run: cp -r /home/ci/data/* $GITHUB_WORKSPACE/data
      - name: Set up Environment
        run: uv sync
      - name: Run ridehailing template
        run: |
          start_time=$(date +%s)
          uv run ridehailing_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          branch_name=$(git rev-parse --abbrev-ref HEAD)
          commit_id=$(git rev-parse HEAD)

          echo "Run ridehailing template took $duration seconds"
          echo "Branch: $branch_name" >> /home/ci/test_runner_data/$OUTPUT_FILE
          echo "Commit ID: $commit_id" >> /home/ci/test_runner_data/$OUTPUT_FILE
          echo "Ridehailing template: $duration s" >> /home/ci/test_runner_data/$OUTPUT_FILE
      - name: Run shared vehicle template
        run: |
          start_time=$(date +%s)
          uv run shared_vehicle_fleet_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Run shared vehicle template took $duration seconds"
          echo "Shared vehicle template: $duration s" >> /home/ci/test_runner_data/$OUTPUT_FILE

      - name: Run public transit template
        run: |
          start_time=$(date +%s)
          uv run public_transport_template.py resources/configurations/testing_config.toml
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Run public transit template took $duration seconds"
          echo "Public transit template: $duration s" >> /home/ci/test_runner_data/$OUTPUT_FILE
